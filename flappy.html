<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Laurea Runner - Flappy Graduation</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      html, body {
        height: 100%;
      }
      body {
        background: #101820;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #game-container {
        position: relative;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        border-radius: 12px;
        overflow: hidden;
        touch-action: none;
      }
      canvas {
        display: block;
        background: linear-gradient(to bottom, #6ec6ff 0%, #bfe9ff 65%, #d8f3ff 100%);
      }
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.45);
        color: white;
        text-align: center;
        padding: 20px;
      }
      h1 {
        font-size: 26px;
        margin-bottom: 10px;
        color: #ffd700;
        text-shadow: 2px 2px 4px #000;
      }
      p {
        font-size: 15px;
        margin-bottom: 18px;
        line-height: 1.4;
      }
      .btn {
        background: #800020;
        color: white;
        border: 2px solid #ffd700;
        padding: 12px 26px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        transition: transform 0.1s, background 0.2s;
      }
      .btn:active {
        transform: scale(0.94);
      }
      .back-link {
        display: block;
        margin-top: 16px;
        color: #cfcfcf;
        font-size: 12.5px;
        text-decoration: none;
        opacity: 0.85;
      }
      .back-link:active {
        opacity: 0.6;
      }
      .stars {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
        font-size: 22px;
      }
      #score-display {
        position: absolute;
        top: 18px;
        left: 0;
        font-size: 40px;
        font-weight: bold;
        color: white;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        width: 100%;
        text-align: center;
        display: none;
        font-family: "Courier New", monospace;
      }
      #best-badge {
        position: absolute;
        top: 62px;
        left: 0;
        width: 100%;
        text-align: center;
        color: #ffd700;
        font-size: 13px;
        font-weight: bold;
        text-shadow: 1px 1px 3px #000;
        pointer-events: none;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas" width="360" height="640"></canvas>
      <div id="score-display">0</div>
      <div id="best-badge">MIGLIOR PUNTEGGIO: 0</div>
      <div id="ui-layer">
        <h1 id="title">SCHIVA I LIBRI!</h1>
        <p id="description">
          Tocca lo schermo o premi la barra spaziatrice per volare<br />
          verso la Laurea. Non toccare i libri! 🎓
        </p>
        <button class="btn" id="start-btn">GIOCA</button>
        <a href="index.html" class="back-link">← Torna alla dashboard</a>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const uiLayer = document.getElementById("ui-layer");
      const scoreDisplay = document.getElementById("score-display");
      const bestBadge = document.getElementById("best-badge");
      const titleText = document.getElementById("title");
      const descText = document.getElementById("description");
      const startBtn = document.getElementById("start-btn");

      const W = canvas.width;
      const H = canvas.height;
      const GROUND_H = 60;

      // ---------- Stato di gioco ----------
      let gameState = "START"; // START, READY, PLAYING, GAMEOVER
      let score = 0;
      let highScore = Number(localStorage.getItem("laureaRunnerBest") || 0);
      let frameCount = 0;
      let groundOffset = 0;
      let bgOffset = 0;

      // ---------- Giocatore (il laureando) ----------
      const player = {
        x: 70,
        y: H / 2,
        width: 40,
        height: 36,
        gravity: 0.42,
        lift: -8,
        maxFall: 9,
        velocity: 0,
        rotation: 0,
        flap: 0, // animazione braccio/tocco
      };

      // ---------- Ostacoli (pile di libri) ----------
      let pipes = [];
      const pipeWidth = 58;
      let pipeGap = 168;
      const pipeSpeed = 2.4;
      const pipeInterval = 105; // frame tra un ostacolo e l'altro

      const bookColors = ["#800020", "#1A365D", "#1C4532", "#7B341E", "#4A5568"];

      // ---------- Coriandoli (celebrazione) ----------
      let confetti = [];
      const confettiColors = ["#ffd700", "#800020", "#ffffff", "#4A90D9"];

      function resetConfetti() {
        confetti = [];
        for (let i = 0; i < 40; i++) {
          confetti.push({
            x: Math.random() * W,
            y: Math.random() * -H,
            size: 4 + Math.random() * 4,
            speed: 1 + Math.random() * 2,
            drift: Math.random() * 2 - 1,
            color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
            rot: Math.random() * Math.PI,
          });
        }
      }
      resetConfetti();

      // ---------- Input ----------
      function handleInput() {
        if (gameState === "READY") {
          gameState = "PLAYING";
          player.velocity = player.lift;
          player.flap = 6;
        } else if (gameState === "PLAYING") {
          player.velocity = player.lift;
          player.flap = 6;
        }
      }

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          if (uiLayer.style.display !== "none") {
            startGame();
          } else {
            handleInput();
          }
        }
      });

      canvas.addEventListener(
        "pointerdown",
        (e) => {
          e.preventDefault();
          if (uiLayer.style.display === "none") {
            handleInput();
          }
        },
        { passive: false },
      );

      startBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        startGame();
      });

      // ---------- Gestione stato ----------
      function startGame() {
        gameState = "READY";
        player.y = H / 2;
        player.velocity = 0;
        player.rotation = 0;
        pipes = [];
        score = 0;
        frameCount = 0;

        scoreDisplay.innerText = "0";
        scoreDisplay.style.display = "block";
        bestBadge.innerText = "MIGLIOR PUNTEGGIO: " + highScore;
        bestBadge.style.display = "block";
        uiLayer.style.display = "none";
      }

      function gameOver() {
        gameState = "GAMEOVER";
        const newRecord = score > highScore;
        if (newRecord) {
          highScore = score;
          localStorage.setItem("laureaRunnerBest", String(highScore));
        }

        titleText.innerText = newRecord ? "NUOVO RECORD! 🎉" : "ESAME BOCCIATO!";
        descText.innerHTML =
          `Punteggio: <b>${score}</b><br>Record: <b>${highScore}</b>` +
          (newRecord ? "<br>Complimenti Dottore! 🎓" : "");
        startBtn.innerText = "RIPROVA";

        bestBadge.style.display = "none";
        uiLayer.style.display = "flex";
      }

      function spawnPipe() {
        const minHeight = 60;
        const maxHeight = H - GROUND_H - pipeGap - minHeight;
        const topHeight =
          Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
        const color = bookColors[Math.floor(Math.random() * bookColors.length)];

        pipes.push({
          x: W,
          top: topHeight,
          bottom: H - GROUND_H - topHeight - pipeGap,
          color: color,
          passed: false,
        });
      }

      // ---------- Update ----------
      function update() {
        groundOffset = (groundOffset - pipeSpeed) % 40;

        if (gameState === "READY") {
          // leggero ondeggiamento in attesa del primo tocco
          player.y = H / 2 + Math.sin(frameCount * 0.08) * 6;
          frameCount++;
          return;
        }

        if (gameState !== "PLAYING") return;

        frameCount++;
        bgOffset = (bgOffset - pipeSpeed * 0.3) % W;

        // Difficoltà crescente leggera
        pipeGap = Math.max(132, 168 - Math.floor(score / 8) * 4);

        // Fisica giocatore
        player.velocity += player.gravity;
        if (player.velocity > player.maxFall) player.velocity = player.maxFall;
        player.y += player.velocity;
        player.rotation = Math.min(Math.max(player.velocity * 0.06, -0.5), 1.2);
        if (player.flap > 0) player.flap--;

        // Collisione con terreno o soffitto
        if (player.y + player.height >= H - GROUND_H) {
          player.y = H - GROUND_H - player.height;
          gameOver();
        }
        if (player.y <= 0) {
          player.y = 0;
          player.velocity = 0;
        }

        // Spawn ostacoli
        if (frameCount % pipeInterval === 0) {
          spawnPipe();
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
          let p = pipes[i];
          p.x -= pipeSpeed;

          const px = player.x + 6;
          const pw = player.width - 12;
          const py = player.y + 6;
          const ph = player.height - 10;

          const hitX = px + pw > p.x && px < p.x + pipeWidth;
          const hitY = py < p.top || py + ph > H - GROUND_H - p.bottom;

          if (hitX && hitY) {
            gameOver();
          }

          if (!p.passed && p.x + pipeWidth < player.x) {
            p.passed = true;
            score++;
            scoreDisplay.innerText = score;
          }

          if (p.x + pipeWidth < 0) {
            pipes.splice(i, 1);
          }
        }
      }

      // ---------- Disegno ----------
      function drawBackground() {
        // Skyline università stilizzato (parallasse)
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        for (let i = -1; i < 3; i++) {
          const bx = bgOffset + i * 150;
          ctx.fillRect(bx, H - GROUND_H - 90, 26, 90);
          ctx.fillRect(bx + 34, H - GROUND_H - 130, 26, 130);
          ctx.fillRect(bx + 68, H - GROUND_H - 70, 26, 70);
          // piccola cupola
          ctx.beginPath();
          ctx.arc(bx + 47, H - GROUND_H - 130, 13, Math.PI, 0);
          ctx.fill();
        }
      }

      function drawGround() {
        ctx.fillStyle = "#3f8f3f";
        ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
        ctx.fillStyle = "#2e7d32";
        ctx.fillRect(0, H - GROUND_H, W, 10);
        ctx.fillStyle = "#c9a86a";
        ctx.fillRect(0, H - GROUND_H + 10, W, GROUND_H - 10);
        // strisce in movimento
        ctx.fillStyle = "rgba(0,0,0,0.08)";
        for (let x = groundOffset; x < W; x += 40) {
          ctx.fillRect(x, H - GROUND_H + 10, 20, GROUND_H - 10);
        }
      }

      function drawPipes() {
        pipes.forEach((p) => {
          // Pila superiore
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, 0, pipeWidth, p.top);
          ctx.fillStyle = "#FFF";
          ctx.fillRect(p.x + 8, 0, pipeWidth - 16, Math.max(0, p.top - 12));
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - 4, Math.max(0, p.top - 12), pipeWidth + 8, 12);
          // dettaglio: piccolo tomo dorato in cima
          ctx.fillStyle = "#ffd700";
          ctx.fillRect(p.x + pipeWidth / 2 - 3, Math.max(0, p.top - 20), 6, 8);

          // Pila inferiore
          const bottomY = H - GROUND_H - p.bottom;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, bottomY, pipeWidth, p.bottom - 12);
          ctx.fillStyle = "#FFF";
          ctx.fillRect(p.x + 8, bottomY + 12, pipeWidth - 16, Math.max(0, p.bottom - 32));
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - 4, bottomY, pipeWidth + 8, 12);
        });
      }

      function drawPlayer() {
        ctx.save();
        ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
        ctx.rotate(player.rotation * 0.35);

        const w = player.width;
        const h = player.height;

        // Toga (corpo)
        ctx.fillStyle = "#1a1a2e";
        ctx.beginPath();
        ctx.moveTo(-w * 0.3, -h * 0.1);
        ctx.quadraticCurveTo(-w * 0.42, h * 0.5, 0, h * 0.5);
        ctx.quadraticCurveTo(w * 0.42, h * 0.5, w * 0.3, -h * 0.1);
        ctx.closePath();
        ctx.fill();

        // Fascia bordeaux
        ctx.strokeStyle = "#ffd700";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-w * 0.15, -h * 0.05);
        ctx.lineTo(-w * 0.05, h * 0.4);
        ctx.stroke();

        // Testa
        ctx.fillStyle = "#ffdbac";
        ctx.beginPath();
        ctx.arc(0, -h * 0.18, w * 0.26, 0, Math.PI * 2);
        ctx.fill();

        // Tocco (cappello da laurea)
        ctx.fillStyle = "#111";
        ctx.beginPath();
        ctx.moveTo(-w * 0.32, -h * 0.32);
        ctx.lineTo(w * 0.32, -h * 0.32);
        ctx.lineTo(0, -h * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.fillRect(-w * 0.1, -h * 0.34, w * 0.2, h * 0.08);
        // nappina
        ctx.strokeStyle = "#ffd700";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(w * 0.28, -h * 0.34);
        ctx.lineTo(w * 0.4, -h * 0.34 + (player.flap > 0 ? -4 : 4));
        ctx.stroke();
        ctx.fillStyle = "#ffd700";
        ctx.beginPath();
        ctx.arc(w * 0.4, -h * 0.34 + (player.flap > 0 ? -4 : 4), 3, 0, Math.PI * 2);
        ctx.fill();

        // Diploma in mano (si muove leggermente quando "sbatte le ali")
        ctx.save();
        ctx.rotate(player.flap > 0 ? -0.5 : 0.15);
        ctx.fillStyle = "#f5f0e0";
        ctx.fillRect(w * 0.15, h * 0.02, w * 0.28, h * 0.14);
        ctx.strokeStyle = "#800020";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(w * 0.15, h * 0.02, w * 0.28, h * 0.14);
        ctx.restore();

        ctx.restore();
      }

      function drawConfettiIntro() {
        confetti.forEach((c) => {
          c.y += c.speed;
          c.x += c.drift;
          c.rot += 0.05;
          if (c.y > H) {
            c.y = -10;
            c.x = Math.random() * W;
          }
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rot);
          ctx.fillStyle = c.color;
          ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.5);
          ctx.restore();
        });
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        drawBackground();

        if (gameState === "START" || gameState === "GAMEOVER") {
          drawConfettiIntro();
        }

        drawPipes();
        drawGround();

        if (gameState !== "START") {
          drawPlayer();
        }
      }

      function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
      }

      gameLoop();
    </script>
  </body>
</html>
