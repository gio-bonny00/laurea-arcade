<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Runner Infinito - Corsa alla Laurea</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
      body {
        background: #101820;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #game-container {
        position: relative;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        border-radius: 12px;
        overflow: hidden;
        touch-action: none;
      }
      canvas {
        display: block;
        background: linear-gradient(to bottom, #ffb56b 0%, #ffe0b3 55%, #fff3dd 100%);
      }
      #ui-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.45);
        color: white;
        text-align: center;
        padding: 20px;
      }
      h1 { font-size: 24px; margin-bottom: 10px; color: #ffd700; text-shadow: 2px 2px 4px #000; }
      p { font-size: 14.5px; margin-bottom: 18px; line-height: 1.4; }
      .btn {
        background: #800020;
        color: white;
        border: 2px solid #ffd700;
        padding: 12px 26px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        transition: transform 0.1s;
      }
      .btn:active { transform: scale(0.94); }
      .back-link {
        display: block;
        margin-top: 16px;
        color: #cfcfcf;
        font-size: 12.5px;
        text-decoration: none;
        opacity: 0.85;
      }
      #score-display {
        position: absolute;
        top: 14px; left: 0;
        width: 100%;
        text-align: center;
        font-size: 30px;
        font-weight: bold;
        color: #3a2410;
        text-shadow: 1px 1px 2px rgba(255,255,255,0.6);
        pointer-events: none;
        display: none;
        font-family: "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas" width="360" height="500"></canvas>
      <div id="score-display">0</div>
      <div id="ui-layer">
        <h1 id="title">CORSA ALLA LAUREA</h1>
        <p id="description">
          Tocca lo schermo o premi la barra spaziatrice per saltare<br />
          esami, sveglie e tazzine di caffè. Occhio alla velocità! ⏰
        </p>
        <button class="btn" id="start-btn">CORRI</button>
        <a href="index.html" class="back-link">← Torna alla dashboard</a>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const uiLayer = document.getElementById("ui-layer");
      const scoreDisplay = document.getElementById("score-display");
      const titleText = document.getElementById("title");
      const descText = document.getElementById("description");
      const startBtn = document.getElementById("start-btn");

      const W = canvas.width;
      const H = canvas.height;
      const GROUND_Y = H - 60;

      let gameState = "START"; // START, PLAYING, GAMEOVER
      let score = 0;
      let highScore = Number(localStorage.getItem("runnerLaureaBest") || 0);
      let speed = 4.2;
      let frameCount = 0;
      let groundOffset = 0;

      const player = {
        x: 55,
        y: GROUND_Y - 46,
        width: 34,
        height: 46,
        vy: 0,
        gravity: 0.75,
        jumpForce: -13.5,
        onGround: true,
        legPhase: 0,
      };

      let obstacles = [];
      const obstacleTypes = [
        { emoji: "📚", w: 30, h: 32, label: "esame" },
        { emoji: "⏰", w: 28, h: 28, label: "sveglia" },
        { emoji: "☕", w: 26, h: 30, label: "caffè" },
        { emoji: "📝", w: 26, h: 30, label: "scadenza" },
      ];

      function jump() {
        if (gameState === "PLAYING" && player.onGround) {
          player.vy = player.jumpForce;
          player.onGround = false;
        }
      }

      function handleStart() {
        if (uiLayer.style.display !== "none") {
          startGame();
        } else {
          jump();
        }
      }

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          handleStart();
        }
      });

      canvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (uiLayer.style.display === "none") jump();
      }, { passive: false });

      startBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        startGame();
      });

      function startGame() {
        gameState = "PLAYING";
        player.y = GROUND_Y - player.height;
        player.vy = 0;
        player.onGround = true;
        obstacles = [];
        score = 0;
        speed = 4.2;
        frameCount = 0;

        scoreDisplay.innerText = "0";
        scoreDisplay.style.display = "block";
        uiLayer.style.display = "none";
      }

      function gameOver() {
        gameState = "GAMEOVER";
        const newRecord = score > highScore;
        if (newRecord) {
          highScore = score;
          localStorage.setItem("runnerLaureaBest", String(highScore));
        }
        titleText.innerText = newRecord ? "NUOVO RECORD! 🎉" : "TI HANNO RIMANDATO!";
        descText.innerHTML =
          `Punteggio: <b>${score}</b><br>Record: <b>${highScore}</b>` +
          (newRecord ? "<br>Sei quasi Dottore! 🎓" : "");
        startBtn.innerText = "RIPROVA";
        scoreDisplay.style.display = "none";
        uiLayer.style.display = "flex";
      }

      function spawnObstacle() {
        const type = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
        obstacles.push({
          x: W + 20,
          w: type.w,
          h: type.h,
          emoji: type.emoji,
          passed: false,
        });
      }

      let nextSpawnIn = 70;

      function update() {
        groundOffset = (groundOffset - speed) % 30;

        if (gameState !== "PLAYING") return;
        frameCount++;

        // difficoltà crescente
        speed = Math.min(9, 4.2 + score * 0.06);

        // fisica salto
        player.vy += player.gravity;
        player.y += player.vy;
        if (player.y >= GROUND_Y - player.height) {
          player.y = GROUND_Y - player.height;
          player.vy = 0;
          player.onGround = true;
        }

        if (player.onGround) {
          player.legPhase += 0.35;
        }

        nextSpawnIn--;
        if (nextSpawnIn <= 0) {
          spawnObstacle();
          nextSpawnIn = Math.max(38, 75 - Math.floor(score / 3)) + Math.floor(Math.random() * 25);
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const o = obstacles[i];
          o.x -= speed;

          const ox = o.x, oy = GROUND_Y - o.h;
          const px = player.x + 5, pw = player.width - 10;
          const py = player.y + 4, ph = player.height - 6;

          if (px + pw > ox && px < ox + o.w && py + ph > oy) {
            gameOver();
          }

          if (!o.passed && o.x + o.w < player.x) {
            o.passed = true;
            score++;
            scoreDisplay.innerText = score;
          }

          if (o.x + o.w < -20) obstacles.splice(i, 1);
        }
      }

      function drawGround() {
        ctx.fillStyle = "#c98a3c";
        ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
        ctx.strokeStyle = "rgba(0,0,0,0.15)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(W, GROUND_Y);
        ctx.stroke();
        ctx.strokeStyle = "rgba(0,0,0,0.08)";
        ctx.lineWidth = 2;
        for (let x = groundOffset; x < W; x += 30) {
          ctx.beginPath();
          ctx.moveTo(x, GROUND_Y + 8);
          ctx.lineTo(x + 14, GROUND_Y + 8);
          ctx.stroke();
        }
      }

      function drawPlayer() {
        ctx.save();
        ctx.translate(player.x + player.width / 2, player.y + player.height / 2);

        // toga
        ctx.fillStyle = "#1a1a2e";
        ctx.fillRect(-player.width / 2, -player.height / 2 + 10, player.width, player.height - 18);

        // gambe animate (solo a terra)
        ctx.strokeStyle = "#1a1a2e";
        ctx.lineWidth = 5;
        const legSwing = player.onGround ? Math.sin(player.legPhase) * 8 : 0;
        ctx.beginPath();
        ctx.moveTo(-6, player.height / 2 - 8);
        ctx.lineTo(-6 + legSwing, player.height / 2 + 6);
        ctx.moveTo(6, player.height / 2 - 8);
        ctx.lineTo(6 - legSwing, player.height / 2 + 6);
        ctx.stroke();

        // testa
        ctx.fillStyle = "#ffdbac";
        ctx.beginPath();
        ctx.arc(0, -player.height / 2 + 6, 11, 0, Math.PI * 2);
        ctx.fill();

        // tocco
        ctx.fillStyle = "#111";
        ctx.beginPath();
        ctx.moveTo(-13, -player.height / 2 - 2);
        ctx.lineTo(13, -player.height / 2 - 2);
        ctx.lineTo(0, -player.height / 2 - 12);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#ffd700";
        ctx.beginPath();
        ctx.arc(13, -player.height / 2 - 2, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawObstacles() {
        ctx.font = "26px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        obstacles.forEach((o) => {
          ctx.font = o.h + "px sans-serif";
          ctx.fillText(o.emoji, o.x + o.w / 2, GROUND_Y - o.h / 2 + 4);
        });
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        drawGround();
        drawObstacles();
        if (gameState !== "START") drawPlayer();
      }

      function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
      }

      gameLoop();
    </script>
  </body>
</html>
